<!DOCTYPE html>
<html>
<head>
<title>Table Attributes</title>
</head>
<body>

<h2>Table with Attributes</h2>

<table border="2" cellpadding="10" cellspacing="0" width="60%" bgcolor="lightyellow" align="center">
  <tr bgcolor="lightblue">
    <th>Item</th>
    <th>Price</th>
  </tr>
  <tr>
    <td align="left">Pen</td>
    <td align="right">10</td>
  </tr>
  <tr>
    <td align="left">Notebook</td>
    <td align="right">50</td>
  </tr>
  <tr>
    <td align="left">Bag</td>
    <td align="right">500</td>
  </tr>
</table>

</body>
</html>
