<!DOCTYPE html>
<html>
<head>
<title>Caption Head Body Foot</title>
</head>
<body>

<table border="1" cellpadding="8">
  <caption><b>Monthly Expenses</b></caption>
  <thead>
    <tr>
      <th>Month</th>
      <th>Amount</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>January</td>
      <td>2000</td>
    </tr>
    <tr>
      <td>February</td>
      <td>1500</td>
    </tr>
    <tr>
      <td>March</td>
      <td>1800</td>
    </tr>
  </tbody>
  <tfoot>
    <tr>
      <td>Total</td>
      <td>5300</td>
    </tr>
  </tfoot>
</table>

</body>
</html>
