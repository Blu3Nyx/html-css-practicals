<!DOCTYPE html>
<html>
<head>
<title>Rowspan and Colspan</title>
</head>
<body>

<h2>Colspan Example</h2>
<table border="1" cellpadding="8">
  <tr>
    <th colspan="3">Student Marks</th>
  </tr>
  <tr>
    <th>Subject</th>
    <th>Theory</th>
    <th>Practical</th>
  </tr>
  <tr>
    <td>Python</td>
    <td>40</td>
    <td>20</td>
  </tr>
  <tr>
    <td>Java</td>
    <td>45</td>
    <td>22</td>
  </tr>
</table>

<h2>Rowspan Example</h2>
<table border="1" cellpadding="8">
  <tr>
    <th>Course</th>
    <th>Subject</th>
  </tr>
  <tr>
    <td rowspan="3">MCA</td>
    <td>Python</td>
  </tr>
  <tr>
    <td>Java</td>
  </tr>
  <tr>
    <td>ADBMS</td>
  </tr>
</table>

<h2>Rowspan and Colspan Together</h2>
<table border="1" cellpadding="8">
  <tr>
    <th rowspan="2">Name</th>
    <th colspan="2">Marks</th>
  </tr>
  <tr>
    <th>Python</th>
    <th>Java</th>
  </tr>
  <tr>
    <td>Harshita</td>
    <td>80</td>
    <td>75</td>
  </tr>
</table>

</body>
</html>
