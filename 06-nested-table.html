<!DOCTYPE html>
<html>
<head>
<title>Nested Table</title>
</head>
<body>

<h2>Nested Table</h2>

<table border="1" cellpadding="10">
  <tr>
    <th>Student</th>
    <th>Marks Details</th>
  </tr>
  <tr>
    <td>Harshita</td>
    <td>
      <table border="1" cellpadding="5">
        <tr>
          <th>Subject</th>
          <th>Marks</th>
        </tr>
        <tr>
          <td>Python</td>
          <td>80</td>
        </tr>
        <tr>
          <td>Java</td>
          <td>75</td>
        </tr>
      </table>
    </td>
  </tr>
</table>

</body>
</html>
