<!DOCTYPE html>
<html>
<head>
<title>Colgroup</title>
</head>
<body>

<table border="1" cellpadding="10">
  <colgroup>
    <col style="background-color: lightblue">
    <col span="2" style="background-color: lightgreen">
  </colgroup>
  <tr>
    <th>Name</th>
    <th>Age</th>
    <th>City</th>
  </tr>
  <tr>
    <td>Harshita</td>
    <td>22</td>
    <td>Pune</td>
  </tr>
  <tr>
    <td>Riya</td>
    <td>23</td>
    <td>Mumbai</td>
  </tr>
</table>

</body>
</html>
