<!DOCTYPE html>
<html>
<head>
<title>CSS Selectors</title>
<style>
  /* element selector */
  h1 {
    color: navy;
  }

  /* class selector */
  .red-text {
    color: red;
  }

  /* id selector */
  #special {
    background-color: yellow;
  }

  /* group selector */
  h2, h3 {
    color: green;
  }

  /* descendant selector */
  div p {
    color: purple;
  }

  /* child selector */
  ul > li {
    color: brown;
  }

  /* universal selector */
  * {
    font-family: Arial;
  }

  /* attribute selector */
  input[type="text"] {
    background-color: lightblue;
  }

  /* pseudo class */
  a:hover {
    color: orange;
  }

  /* first child */
  li:first-child {
    font-weight: bold;
  }
</style>
</head>
<body>

<h1>CSS Selectors</h1>

<h2>Heading Two</h2>
<h3>Heading Three</h3>

<p class="red-text">This paragraph uses a class.</p>
<p id="special">This paragraph uses an id.</p>

<div>
  <p>This paragraph is inside a div.</p>
</div>
<p>This paragraph is outside the div.</p>

<ul>
  <li>First item</li>
  <li>Second item</li>
  <li>Third item</li>
</ul>

<input type="text" placeholder="Text input">
<input type="password" placeholder="Password input">

<br><br>
<a href="#">Hover over this link</a>

</body>
</html>
